name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NodeKit.sln --locked-mode

      # Consumer bytes == protos/provenance.json == producer bytes at the
      # pinned NodeVault commit. Never consults NodeVault's moving main.
      - name: Proto provenance (pinned producer)
        run: python3 scripts/verify-proto-provenance.py --fetch-producer

      - name: Proto provenance script self-test
        run: python3 scripts/test_verify_proto_provenance.py -v

      - name: CLI manifest writer self-test
        run: python3 scripts/test_write_cli_manifest.py -v

      - name: CLI closure checker self-test
        run: python3 scripts/test_check_cli_closure.py -v

      - name: CLI clean build script self-test
        run: python3 scripts/test_verify_cli_clean_build.py -v

      - name: CLI package output checker self-test
        run: python3 scripts/test_verify_cli_package.py -v

      - name: CLI test report gate self-test
        run: python3 scripts/test_check_cli_test_report.py -v

      # S4-05-A: the CLI acceptance runs against local fakes only. A live
      # NodeVault URL would turn the skipped integration tests into network
      # calls, so the job refuses to run with one set.
      - name: No live NodeVault endpoint
        run: |
          if [ -n "${NODEKIT_NODEVAULT_URL:-}" ]; then
            echo "::error::NODEKIT_NODEVAULT_URL is set; CLI CI must not use a live NodeVault"
            exit 1
          fi

      # Runs the package script exactly as docs §5 writes it (not via bash), so a
      # lost executable bit fails here (rc 126) instead of on a user's clone.
      - name: CLI package script runs as documented
        run: |
          rc=0
          scripts/package-cli.sh --help 2>/dev/null || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "::error::scripts/package-cli.sh --help exited $rc, expected 2 (126 = not executable)"
            exit 1
          fi

      - name: NuGet package audit
        run: ./scripts/ci-audit-packages.sh

      - name: Format
        run: dotnet format NodeKit.sln --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build NodeKit.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=true /p:EnforceCodeStyleInBuild=true

      # Two clean package runs of the same commit/version must produce the same
      # archive bytes; the pause makes the second run's files get newer mtimes.
      - name: CLI package is reproducible
        run: |
          scripts/package-cli.sh --version 0.0.0-ci --output "$RUNNER_TEMP/pkg-a"
          sleep 2
          scripts/package-cli.sh --version 0.0.0-ci --output "$RUNNER_TEMP/pkg-b"
          a="$(cut -d' ' -f1 "$RUNNER_TEMP/pkg-a/nodekit-cli-0.0.0-ci-linux-x64.tar.gz.sha256")"
          b="$(cut -d' ' -f1 "$RUNNER_TEMP/pkg-b/nodekit-cli-0.0.0-ci-linux-x64.tar.gz.sha256")"
          if [ "$a" != "$b" ]; then
            echo "::error::package archive is not reproducible: $a != $b"
            exit 1
          fi

      # S4-05-C: a missing archive/checksum/manifest, or an archive whose files
      # differ from its manifest, fails here even if package-cli.sh exited 0.
      - name: CLI package output is complete
        run: python3 scripts/verify-cli-package.py --dir "$RUNNER_TEMP/pkg-a" --version 0.0.0-ci

      # S4-01: a NodeKit-only clean checkout of HEAD (no NodeVault/DockGuard
      # sibling) restores and builds the CLI alone, its closure has no GUI/K8s
      # package, and a missing vendored proto fails with NKPROTO004.
      - name: CLI clean build and closure (S4-01)
        run: scripts/verify-cli-clean-build.sh

      # Each project writes to its own subdirectory — running them together
      # via "dotnet test --solution ... --coverage-output coverage.cobertura.xml"
      # made both projects write to the exact same path, so one silently
      # overwrote the other (see scripts/ci-check-coverage.py's docstring).
      - name: Test with coverage (NodeKit.Tests)
        run: dotnet test --project tests/NodeKit.Tests --no-build --configuration Release --results-directory TestResults/NodeKit.Tests --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      # S4-04-A–F (P10.executable): PublishedCliProcessTests and the published
      # register-replay tests run the pkg-a archive checked above as a separate
      # process from outside the repository. Without this variable they skip, and
      # the report gate below fails on a skip in those classes.
      - name: Test with coverage (NodeKit.Cli.Tests)
        env:
          NODEKIT_CLI_PACKAGE_DIR: ${{ runner.temp }}/pkg-a
          NODEKIT_CLI_ACCEPTANCE_OUT: ${{ github.workspace }}/TestResults/published-cli
        run: dotnet test --project tests/NodeKit.Cli.Tests --no-build --configuration Release --results-directory TestResults/NodeKit.Cli.Tests --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura --report-xunit --report-xunit-filename cli-tests.xunit.xml

      # S4-05-A/C: an empty or shrunken run, a failure, or a skip outside the two
      # live-NodeVault integration classes is not a pass.
      - name: CLI test report gate
        run: >-
          python3 scripts/check-cli-test-report.py
          --report TestResults/NodeKit.Cli.Tests/cli-tests.xunit.xml
          --min-total 1100
          --allow-skip-class NodeKit.Cli.Tests.GrpcToolSpecClientIntegrationTests
          --allow-skip-class NodeKit.Cli.Tests.GrpcResolveRecipeClientIntegrationTests

      # S4-05-A / #109: both classes change the process-global
      # NODEKIT_HARBOR_IMAGE_MAP. They share a non-parallel collection; run them
      # together repeatedly under the normal parallel settings so a lost
      # collection shows up as a failure here.
      - name: NODEKIT_HARBOR_IMAGE_MAP isolation repeat (#109)
        run: |
          runs=20
          echo "sha=$(git rev-parse HEAD) runs=$runs"
          for i in $(seq 1 "$runs"); do
            if ! dotnet test --project tests/NodeKit.Cli.Tests --no-build --configuration Release \
                --filter-class NodeKit.Cli.Tests.HarborBaseImageSelectionTests \
                --filter-class NodeKit.Cli.Tests.MappedHarborImageDigestResolverTests >"$RUNNER_TEMP/iso-$i.log" 2>&1; then
              cat "$RUNNER_TEMP/iso-$i.log"
              echo "::error::#109 isolation run $i/$runs failed"
              exit 1
            fi
            echo "run $i/$runs: $(grep -m1 -E 'total: [0-9]+' "$RUNNER_TEMP/iso-$i.log" || tail -n 1 "$RUNNER_TEMP/iso-$i.log")"
          done

      - name: Coverage threshold
        run: ./scripts/ci-check-coverage.py

      - name: Coverage gate script self-test
        run: python3 scripts/test_ci_check_coverage.py -v

      # Runs after the tests: it starts deliberately failing Release builds
      # with an undeclared /p:ApiProtosRoot= override (stopped before compile).
      - name: Proto override guard self-test
        run: python3 scripts/test_proto_override_guard.py -v

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload CLI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-report
          path: TestResults/NodeKit.Cli.Tests/cli-tests.xunit.xml
          if-no-files-found: error

      # Each published-process run: package sha256, source sha, cwd, args, exit,
      # stdout and stderr (S4-04-F transcript tied to the package hash).
      - name: Upload published CLI transcript
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-cli-transcript
          path: TestResults/published-cli/published-cli-transcript.jsonl
          if-no-files-found: error
