name: "NodeKit CodeQL config"

# obj/ and bin/ are build output (generated protobuf/gRPC code, xUnit's
# auto-generated test entry points) — not checked in, not something anyone
# can fix, regenerated on every build. Scanning them was producing ~37
# unactionable alerts (2026-07-16 audit).
paths-ignore:
  - "**/obj/**"
  - "**/bin/**"
